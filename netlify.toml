[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# old landing page address goes to the quote page
[[redirects]]
  from = "https://quote.prestigesignaturecleaning.co.uk/*"
  to = "https://prestigesignaturecleaning.co.uk/quote"
  status = 301
  force = true

[[redirects]]
  from = "http://quote.prestigesignaturecleaning.co.uk/*"
  to = "https://prestigesignaturecleaning.co.uk/quote"
  status = 301
  force = true
